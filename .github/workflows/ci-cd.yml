name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TodayInSpace.slnx

      - name: Build
        run: dotnet build TodayInSpace.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TodayInSpace.slnx --configuration Release --no-build --verbosity normal

      - name: Publish web app
        run: dotnet publish src/TodayInSpace.Web/TodayInSpace.Web.csproj -c Release -o out/web --no-build

      - name: Publish function app
        run: dotnet publish src/TodayInSpace.Function/TodayInSpace.Function.csproj -c Release -o out/function

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: out/web

      - uses: actions/upload-artifact@v4
        with:
          name: function
          path: out/function
          # The isolated worker needs the hidden .azurefunctions folder; without it the
          # host loads 0 functions. upload-artifact skips hidden files by default.
          include-hidden-files: true

  # Deploys on pushes to main (or a manual "Run workflow"), and only once the Azure secrets/variables are set
  # (see README > Deploying). Until then this job is skipped instead of failing.
  deploy:
    needs: build-test
    if: github.event_name != 'pull_request' && vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - uses: actions/download-artifact@v4
        with:
          name: function
          path: function

      - name: Deploy web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: web

      - name: Deploy function app
        if: vars.AZURE_FUNCTIONAPP_NAME != ''
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTIONAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          package: function
